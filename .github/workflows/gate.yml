name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Android 的 /system/bin/sh 就是 mksh：先在 CI 里装上，让交叉验证覆盖它
      - name: 安装 mksh（真机同款 shell）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mksh

      # 三份实现 × 一张表：任何一份与 spec 不一致就红（装了 mksh 就自动多跑一个）
      - name: 版本闸门三实现对照
        run: python3 tools/check-gate.py

      # 产物与真源同步：payload 的 layer sha256 已是真值，必须用发布模式（任何占位都 exit 2）
      - name: 生成产物并校验漂移
        run: |
          python3 tools/gen-version.py
          python3 tools/gen-version.py --check

      # 版本真源契约：台账是第 4 位与 baked 的唯一来源（ADR-025）
      - name: 版本真源契约（台账 / 拒绝类断言）
        run: python3 tools/test-versioning.py

      # vendor 基准线：第三方文件哈希 + DSH 树清单（ADR-027）
      - name: vendor 基准线
        run: python3 tools/vendor-check.py

      # 模块包：< 1 MB、确定性；selftest 会模拟安装到临时 DSH_ROOT（ADR-024）
      - name: 模块打包 + 安装模拟
        run: |
          python3 tools/build-module.py
          python3 tools/build-module.py --check
          python3 tools/build-module.py --selftest
      # 真机自检脚本必须由 lib + spec 生成，不许手改
      - name: 设备自检脚本与源保持一致
        run: python3 tools/build-device-selftest.py --check

      # 报错文档必须由 spec/errors.json 生成：手改 docs/errors.md、或改了真源忘了生成，都会红（ADR-030）
      - name: 报错文档与真源一致
        run: python3 tools/gen-errors.py --check

      # diag 消费上面那张表：证据 -> 命中码 -> 组合签名（ADR-030）。
      # 只读、不联网、不启容器；跑了它才知道「判读对不对」，而不只是「文档对不对」
      - name: diag 判读契约测试（dash）
        run: dash tools/test-diag.sh

      - name: diag 判读契约测试（mksh）
        run: mksh tools/test-diag.sh

      # 生成出来的单文件脚本本身也要能跑（dash + mksh 各跑一遍 76 条）
      - name: 单文件自检脚本可运行
        run: |
          dash tools/verify-gate-device.sh
          mksh tools/verify-gate-device.sh

      # P1 载体：sdk profile 的 stdio JSON-RPC 握手（ADR-028）。假 dsh 驱动，不装真包、不联网
      - name: sdk 协议探针自测（dash）
        run: dash tools/test-sdk-protocol.sh

      - name: sdk 协议探针自测（mksh）
        run: mksh tools/test-sdk-protocol.sh

      # 壳的六条契约 + 退出码表（ADR-013 / ADR-024）
      - name: 壳契约测试（dash）
        run: dash tools/test-service.sh

      - name: 壳契约测试（mksh）
        run: mksh tools/test-service.sh

      # 公开入口（dsh-ctl）：参数校验 / 审计 / 透传 / 环境归一化
      - name: 入口契约测试（dash）
        run: dash tools/test-dsh-ctl.sh

      # payload 打包器：确定性 + 校验 + 篡改检测
      - name: payload 构建器自测
        run: python3 tools/build-payload.py --selftest
